
{
    "url": "tcp://*:10000-10200",

  # "cspot": {
  #     "interval" : 5,
  #     "woof_url" : "woof://169.231.230.76",
  #     "woof_path": "/sharedfs/cups-data/daviscupsout",
  #     "data_dir" : "/groups/xgfabric/amerzky/demo1/cspot_data",
  #     "cspot_get": "/groups/xgfabric/amerzky/demo1/tools/cspot-get -W"
  # },

    "cspot": {
        "interval" : 5,
        "woof_url" : "",
        "woof_path": "/tmp/woof.txt",
        "data_dir" : "/tmp/cspot_data",
        "cspot_get": "cat"
    },

 #  "filesystem": {
 #      "input" : "/groups/xgfabric/amerzky/demo1/fs_input",
 #      "output": "/groups/xgfabric/amerzky/demo1/fs_output"
 #  },

    "filesystem": {
        "input" : "/tmp/fs_input",
        "output": "/tmp/fs_output"
    },

    "controller": {
        "description": {
            "resource"  : "local.localhost",
            "runtime"   : 3600,
            "nodes"     : 1
        }
    },

    "workload": {
        "seciterations": 50,

        "environment"  :
        {
            "XGFABRIC_TOOLS"  : "/groups/xgfabric/amerzky/demo1/tools"
        },

        "tasks": [
            {
                "uid"       : "prep_data",
                "executable": "$XGFABRIC_TOOLS/prep_data.sh",
                "arguments" : ["input.dat"]
            },
            {
                "uid"       : "decompose",
          #     "pre_exec"  : ["module load openfoam"],
                "executable": "decomposePar"
            },
            {
                "uid"       : "openfoam",
          #     "pre_exec"  : ["module load openfoam"],
                "executable": "porousSimpleFoam",
                "arguments" : ["-parallel"]
            },
            {
                "uid"       : "reconstruct",
          #     "pre_exec"  : ["module load openfoam"],
                "executable": "reconstructPar"
            }
        ]
    }
}

