
{
    "url": "tcp://*:10000-10200",

    "cspot": {
        "interval" : 5,
        "woof_url" : "woof://169.231.230.76",
        "woof_path": "/sharedfs/cups-data/daviscupsout",
        "data_dir" : "/groups/xgfabric/amerzky/demo1/cspot_data",
        "cspot_get": "/groups/xgfabric/amerzky/demo1/tools/senspot-get -W"
    },

  # "cspot": {
  #     "interval" : 5,
  #     "woof_url" : "",
  #     "woof_path": "/tmp/woof.txt",
  #     "data_dir" : "/tmp/cspot_data",
  #     "cspot_get": "cat"
  # },

    "filesystem": {
        "input" : "/groups/xgfabric/amerzky/demo1/fs_input",
        "output": "/groups/xgfabric/amerzky/demo1/fs_output"
    },
  
  # "filesystem": {
  #     "input" : "/tmp/fs_input",
  #     "output": "/tmp/fs_output"
  # },
   
    "controller": {
        "description": {
            "resource"  : "local.localhost",
            "runtime"   : 3600,
            "cores"     : 64
        }
    },

    "workload": {
        "environment"  :
        {
            "XGFABRIC_TOOLS"  : "/groups/xgfabric/amerzky/demo1/tools",
            "XGFABRIC_SECITER": 50,
            "XGFABRIC_RANKS"  : 4
        },

        "tasks": [
            {
                "uid"          : "prep_data",
                "input_staging": ["/groups/xgfabric/amerzky/demo1/cups_structure.zip",
                                  "/groups/xgfabric/amerzky/demo1/spare_details.zip",
                                  "/groups/xgfabric/amerzky/demo1/tools/prep_data.sh",
                                  "/groups/xgfabric/amerzky/demo1/tools/replace.py"],
                "executable"   : "/bin/sh", 
                "arguments"    : ["./prep_data.sh"], 
                "stdout"       : "all.log", 
                "stderr"       : "all.log"
            },
            {
                "uid"          : "decompose",
                "pre_exec"     : ["module load openfoam/10.0/gcc/8.5.0"],
                "executable"   : "decomposePar", 
                "stdout"       : "all.log", 
                "stderr"       : "all.log"
            },
            {
                "uid"          : "openfoam",
                "ranks"        : null,
                "pre_exec"     : ["module load openfoam/10.0/gcc/8.5.0"],
                "executable"   : "porousSimpleFoam",
                "arguments"    : ["-parallel"], 
              # "arguments"    : [],
                "stdout"       : "all.log", 
                "stderr"       : "all.log"
            },
            {
                "uid"          : "reconstruct",
                "pre_exec"     : ["module load openfoam/10.0/gcc/8.5.0"],
                "executable"   : "reconstructPar",
                "stdout"       : "all.log", 
                "stderr"       : "all.log"
            }
        ]
    }
}

